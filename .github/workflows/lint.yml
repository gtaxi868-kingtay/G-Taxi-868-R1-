name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
        if: always()
      - run: npm run typecheck
        if: always()
      # All app suites repaired and green (rider 42, driver 12, admin 2, merchant 2)
      # — tests are now a hard gate again.
      - run: npm test
        if: always()
      - run: npx turbo run build
        continue-on-error: true
