name: Load Test Staging

# Ramps to 1000 virtual users. It must NEVER point at production
# (ffbbuafgeypvkpcuvdnv): the guard step refuses if the URL or the anon key's
# project ref is production, or if either is unset.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type load-staging to run the staging load test'
        required: true
        default: ''

jobs:
  load-test:
    if: ${{ inputs.confirmation == 'load-staging' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      STAGING_ACCESS_TOKEN: ${{ secrets.STAGING_ACCESS_TOKEN }}
    steps:
      - name: Refuse to run against production
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Staging SUPABASE_URL / SUPABASE_ANON_KEY not set. No staging project exists yet."
            exit 1
          fi
          case "$SUPABASE_URL" in
            *ffbbuafgeypvkpcuvdnv*)
              echo "::error::SUPABASE_URL points at PRODUCTION (ffbbuafgeypvkpcuvdnv). Refusing to load test."
              exit 1
              ;;
          esac
          key_ref=$(python3 - <<'PY'
          import base64, json, os
          try:
              payload = os.environ["SUPABASE_ANON_KEY"].split(".")[1]
              payload += "=" * (-len(payload) % 4)
              print(json.loads(base64.urlsafe_b64decode(payload)).get("ref", ""))
          except Exception:
              print("")
          PY
          )
          if [ "$key_ref" = "ffbbuafgeypvkpcuvdnv" ]; then
            echo "::error::SUPABASE_ANON_KEY belongs to PRODUCTION (ffbbuafgeypvkpcuvdnv). Refusing to load test."
            exit 1
          fi

      - uses: actions/checkout@v4
      - name: Run k6 staging load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load-tests/k6/staging-smoke.js
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          STAGING_ACCESS_TOKEN: ${{ env.STAGING_ACCESS_TOKEN }}
