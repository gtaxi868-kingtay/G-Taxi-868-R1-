name: Deploy Supabase

# SAFETY (#10): deploys are MANUAL ONLY. The previous config ran `supabase db push`
# automatically on every push to main touching supabase/** — which would blindly
# apply the entire (currently non-replayable) migration history to PROD on merge.
# That is exactly how a 2 AM merge breaks production. Until the migration history is
# baselined + verified, deployment requires an explicit human-triggered run with a
# typed confirmation, and previews the migration diff before applying.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you intend to apply migrations + functions to PRODUCTION.'
        required: true
        default: ''
      functions:
        description: 'Also deploy edge functions? (true/false)'
        required: false
        default: 'false'

jobs:
  deploy:
    name: Deploy Migrations and Edge Functions
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Project
        run: supabase link --project-ref $PROJECT_ID

      - name: Preview migration diff (dry run)
        run: supabase db push --dry-run

      - name: Push DB Migrations
        run: supabase db push

      - name: Deploy Edge Functions
        if: ${{ github.event.inputs.functions == 'true' }}
        run: supabase functions deploy
