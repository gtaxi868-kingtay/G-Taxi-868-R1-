name: Deploy Staging

# MANUAL ONLY. No staging Supabase project exists yet, so this must never auto-run
# on push. It refuses to run if the configured project is PRODUCTION
# (ffbbuafgeypvkpcuvdnv).
#
# DATABASE MIGRATIONS ARE NEVER APPLIED BY CI (no `supabase db push`, no
# `--dry-run`). Migrations are applied individually and verified per CLAUDE.md
# "DATABASE & MIGRATION RULES".
#
# EDGE FUNCTIONS: 1-5 explicitly named functions per run; each function's live
# verify_jwt is read from the Management API and preserved (fails closed).
on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'REQUIRED: space-separated edge function names (1-5) to deploy to STAGING'
        required: true
        default: ''

jobs:
  validate:
    name: Validate and deploy staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
    steps:
      - name: Refuse to run against production
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_ID:-}" ]; then
            echo "::error::Staging SUPABASE_PROJECT_ID is not set. No staging project exists yet."
            exit 1
          fi
          if [ "$PROJECT_ID" = "ffbbuafgeypvkpcuvdnv" ]; then
            echo "::error::Staging SUPABASE_PROJECT_ID is the PRODUCTION project (ffbbuafgeypvkpcuvdnv). Refusing to run."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test -- --runInBand

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Migrations intentionally absent — see header. Never add `supabase db push` here.

      - name: Validate function list and read live verify_jwt
        id: plan
        env:
          FUNCTIONS_INPUT: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is not set}"
          : "${PROJECT_ID:?SUPABASE_PROJECT_ID secret is not set}"
          if [ "$PROJECT_ID" = "ffbbuafgeypvkpcuvdnv" ]; then
            echo "::error::Refusing to deploy: project is PRODUCTION."
            exit 1
          fi

          read -r -a FNS <<< "${FUNCTIONS_INPUT:-}"
          if [ "${#FNS[@]}" -eq 0 ]; then
            echo "::error::No function names given. Name 1-5 functions explicitly. A bare 'supabase functions deploy' redeploys EVERY function."
            exit 1
          fi
          if [ "${#FNS[@]}" -gt 5 ]; then
            echo "::error::${#FNS[@]} functions requested; the limit is 5 per run (CLAUDE.md: deploy in batches of 3-5)."
            exit 1
          fi
          if [ -n "$(printf '%s\n' "${FNS[@]}" | sort | uniq -d)" ]; then
            echo "::error::Duplicate function names in input."
            exit 1
          fi

          PLAN="$RUNNER_TEMP/function_deploy_plan.tsv"
          : > "$PLAN"
          for fn in "${FNS[@]}"; do
            if ! [[ "$fn" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
              echo "::error::Invalid function name: '$fn'"
              exit 1
            fi
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "::error::supabase/functions/$fn does not exist at this revision."
              exit 1
            fi

            body="$RUNNER_TEMP/fn_${fn}.json"
            if ! code=$(curl -sS -o "$body" -w '%{http_code}' \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$PROJECT_ID/functions/$fn"); then
              echo "::error::Management API request failed for '$fn'. Refusing to deploy without knowing its live verify_jwt."
              exit 1
            fi
            if [ "$code" != "200" ]; then
              echo "::error::Could not read live settings for '$fn' (HTTP $code). Refusing to deploy. A brand-new function must be deployed by hand with a deliberate verify_jwt choice."
              exit 1
            fi
            live=$(jq -r 'if (.verify_jwt | type) == "boolean" then (.verify_jwt | tostring) else "unknown" end' "$body")
            if [ "$live" = "unknown" ]; then
              echo "::error::Live response for '$fn' has no boolean verify_jwt. Refusing to deploy."
              exit 1
            fi

            declared=$(python3 - "$fn" <<'PY'
          import os, sys, tomllib
          path = "supabase/config.toml"
          if not os.path.exists(path):
              print("unset"); sys.exit(0)
          with open(path, "rb") as f:
              cfg = tomllib.load(f)
          v = cfg.get("functions", {}).get(sys.argv[1], {}).get("verify_jwt")
          print("unset" if v is None else str(bool(v)).lower())
          PY
            )
            if [ "$declared" != "unset" ] && [ "$declared" != "$live" ]; then
              echo "::error::supabase/config.toml sets verify_jwt=$declared for '$fn' but LIVE is verify_jwt=$live. The CLI would apply the config.toml value. Make config.toml match live before deploying."
              exit 1
            fi

            printf '%s\t%s\n' "$fn" "$live" >> "$PLAN"
            echo "$fn: live verify_jwt=$live (config.toml: $declared)"
          done

      - name: Deploy named staging edge functions (verify_jwt preserved)
        id: deploy_fns
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r fn live; do
            if [ "$live" = "false" ]; then
              echo "Deploying $fn with --no-verify-jwt (live verify_jwt=false)"
              supabase functions deploy "$fn" --project-ref "$PROJECT_ID" --no-verify-jwt
            else
              echo "Deploying $fn with JWT verification (live verify_jwt=true)"
              supabase functions deploy "$fn" --project-ref "$PROJECT_ID"
            fi
          done < "$RUNNER_TEMP/function_deploy_plan.tsv"

      - name: Confirm verify_jwt unchanged
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: |
          set -euo pipefail
          fail=0
          while IFS=$'\t' read -r fn expected; do
            if ! resp=$(curl -sS --fail \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$PROJECT_ID/functions/$fn"); then
              echo "::error::Post-deploy lookup failed for '$fn'. Check its verify_jwt by hand."
              fail=1
              continue
            fi
            now=$(jq -r '.verify_jwt | tostring' <<< "$resp")
            version=$(jq -r '.version | tostring' <<< "$resp")
            if [ "$now" != "$expected" ]; then
              echo "::error::'$fn' verify_jwt changed: was $expected, now $now (version $version)."
              fail=1
            else
              echo "$fn: version $version, verify_jwt=$now (unchanged)"
            fi
          done < "$RUNNER_TEMP/function_deploy_plan.tsv"
          exit "$fail"

      - name: Verify staging health
        if: env.HEALTHCHECK_URL != ''
        run: ./scripts/check-deployment-health.sh "$HEALTHCHECK_URL"
