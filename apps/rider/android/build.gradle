// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '35')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// G-Taxi One Engine: Kill broken maps interfaces
allprojects { project ->
    def fixMaps = {
        if (project.name.contains('react-native-maps')) {
            def brokenFolder = file("${project.projectDir}/src/main/java/com/facebook/react/viewmanagers")
            if (brokenFolder.exists()) {
                println "G-Taxi: Deleting broken ViewManager interfaces in ${project.name}"
                brokenFolder.deleteDir()
            }
        }
    }
    if (project.state.executed) {
        fixMaps()
    } else {
        project.afterEvaluate { fixMaps() }
    }
}

// G-Taxi One Engine: Patch react-native-nfc-manager for Android API 33+
allprojects { p ->
    if (p.name.contains('react-native-nfc-manager')) {
        p.afterEvaluate {
            def patchTask = tasks.register('patchNfcForApi33') {
                doLast {
                    def nfcFile = file("${projectDir}/src/main/java/community/revteltech/nfc/NfcManager.java")
                    if (nfcFile.exists()) {
                        def content = nfcFile.text
                        def patched = content.replaceAll(
                            /nfcAdapter\.setNdefPushMessage\(msgToPush, currentActivity\);/,
                            'if (android.os.Build.VERSION.SDK_INT < android.os.Build.VERSION_CODES.TIRAMISU) {\n' +
                            '    nfcAdapter.setNdefPushMessage(msgToPush, currentActivity);\n' +
                            '}'
                        )
                        if (content != patched) {
                            nfcFile.text = patched
                            println "G-Taxi: Patched NfcManager.java for API 33+"
                        }
                    }
                }
            }
            tasks.matching { it.name == 'preBuild' }.configureEach {
                dependsOn patchTask
            }
        }
    }
}
