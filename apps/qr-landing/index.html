<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0D0B1E 0%, #160B32 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #7B5CF0 0%, #00E5FF 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(123, 92, 240, 0.3);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            margin-bottom: 32px;
            text-align: center;
        }
        .location, .status-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(123, 92, 240, 0.3);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            max-width: 340px;
            width: 100%;
        }
        .location-icon, .status-icon {
            font-size: 24px;
        }
        .location-text, .status-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }
        .location-text strong, .status-text strong {
            color: white;
            display: block;
            font-size: 16px;
            margin-bottom: 2px;
        }
        .btn {
            width: 100%;
            max-width: 340px;
            padding: 18px 24px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #7B5CF0 0%, #00E5FF 100%);
            color: white;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(123, 92, 240, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(123, 92, 240, 0.5);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }
        .loading {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(123, 92, 240, 0.3);
            border-top-color: #7B5CF0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden {
            display: none !important;
        }
        #map {
            width: 100%;
            max-width: 340px;
            height: 200px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
        }
    </style>
</head>
<body>
    <div class="logo">G</div>
    <h1 id="mainTitle">Request Your Ride</h1>
    <p class="subtitle" id="mainSubtitle">Fast, safe rides in Trinidad & Tobago</p>
    
    <div id="requestUI">
        <div class="location" id="locationBox">
            <span class="location-icon">📍</span>
            <div class="location-text">
                <strong id="standName">Loading location...</strong>
                <span id="standAddress">Please allow location access</span>
            </div>
        </div>

        <button class="btn btn-primary" id="requestBtn" onclick="requestRide()">
            <span>🚗</span> Open G-Taxi App
        </button>
        
        <a class="btn btn-secondary" id="whatsappBtn" href="#" onclick="openWhatsAppFallback()">
            <span>💬</span> Request via WhatsApp
        </a>
    </div>

    <div id="trackUI" class="hidden">
        <div id="map"></div>
        <div class="status-card">
            <span class="status-icon" id="statusEmoji">🚕</span>
            <div class="status-text">
                <strong id="statusTitle">Searching for Driver</strong>
                <span id="statusSub">Hang tight, your G-Taxi is coming.</span>
            </div>
        </div>
        <button class="btn btn-primary" onclick="window.location.reload()">
            <span>🔄</span> Refresh Status
        </button>
    </div>

    <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <p id="loadingMsg">Opening G-Taxi...</p>
    </div>

    <p class="footer">
        Don't have the app?<br>
        <a href="#" onclick="openAppStore()" style="color: #00E5FF;">Download on App Store</a> or 
        <a href="#" onclick="openPlayStore()" style="color: #00E5FF;">Google Play</a>
    </p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase Initialization (Headless Client)
        const SUPABASE_URL = "https://ffbbuafgeypvkpcuvdnv.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmYmJ1YWZnZXlwdmtwY3V2ZG52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc5ODAsImV4cCI6MjA4NjUxMzk4MH0.0bvE6YskOdVROtbto3RrJA9Vj--9M2hKg76oZkOxia8";
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        // Configuration
        const STAND_LOCATIONS = {
            'san-grande': { name: 'San Grande Taxi Stand', lat: 10.65, lng: -61.4 },
            'pos-central': { name: 'Port of Spain Central', lat: 10.65, lng: -61.5167 },
            'arima': { name: 'Arima Taxi Stand', lat: 10.6333, lng: -61.2833 },
            'chaguanas': { name: 'Chaguanas Taxi Stand', lat: 10.5167, lng: -61.4167 },
        };

        // Parse URL params
        const urlParams = new URLSearchParams(window.location.search);
        const rideId = urlParams.get('ride');
        const standId = urlParams.get('stand') || 'san-grande';
        const stand = STAND_LOCATIONS[standId] || STAND_LOCATIONS['san-grande'];

        if (rideId) {
            initTracking(rideId);
        } else {
            initRequest();
        }

        function initRequest() {
            document.getElementById('standName').textContent = stand.name;
            document.getElementById('standAddress').textContent = 'Taxi Stand · GPS Located';
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => { userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude }; },
                    () => { userLocation = { lat: stand.lat, lng: stand.lng }; }
                );
            }
        }

        async function initTracking(id) {
            document.getElementById('requestUI').classList.add('hidden');
            document.getElementById('trackUI').classList.remove('hidden');
            document.getElementById('mainTitle').textContent = "Track Your G-Taxi";
            document.getElementById('mainSubtitle').textContent = "Real-time guest monitoring";
            
            if (!supabase) return;

            // Initial fetch
            const { data: ride } = await supabase.from('rides').select('*, driver:driver_id(full_name, car_model, car_number)').eq('id', id).single();
            if (ride) updateTrackingUI(ride);

            // Real-time subscription
            supabase.channel('public:rides')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rides', filter: `id=eq.${id}` }, 
                payload => updateTrackingUI(payload.new))
                .subscribe();
        }

        function updateTrackingUI(ride) {
            const statusMap = {
                'requested': { title: 'Waiting for Confirmation', sub: 'Your request is being processed', emoji: '⏳' },
                'searching': { title: 'Searching...', sub: 'Finding your driver near ' + ride.pickup_address, emoji: '🔎' },
                'assigned': { title: 'Driver Dispatched', sub: `${ride.driver?.full_name || 'A driver'} is on the way in a ${ride.driver?.car_model || 'vehicle'}`, emoji: '🚗' },
                'arrived': { title: 'Driver is Outside', sub: `Look for ${ride.driver?.car_model || 'the vehicle'} - ${ride.driver?.car_number || ''}`, emoji: '📍' },
                'in_progress': { title: 'Ride in Progress', sub: 'Heading to ' + ride.dropoff_address, emoji: '⚡' },
                'completed': { title: 'Ride Completed', sub: 'Hope you enjoyed your G-Taxi trip!', emoji: '✅' },
                'cancelled': { title: 'Ride Cancelled', sub: 'This ride has been cancelled', emoji: '❌' }
            };

            const info = statusMap[ride.status] || { title: 'Processing...', sub: 'Updating ride status', emoji: '🔄' };
            document.getElementById('statusTitle').textContent = info.title;
            document.getElementById('statusSub').textContent = info.sub;
            document.getElementById('statusEmoji').textContent = info.emoji;
        }

        let userLocation = null;

        function requestRide() {
            const loading = document.getElementById('loadingState');
            const btn = document.getElementById('requestBtn');
            loading.classList.add('show');
            btn.classList.add('hidden');

            const lat = userLocation?.lat || stand.lat;
            const lng = userLocation?.lng || stand.lng;
            const deepLink = `gtaxi://request?lat=${lat}&lng=${lng}&stand=${standId}&source=qr`;
            
            window.location.href = deepLink;

            setTimeout(() => {
                document.getElementById('whatsappBtn').style.display = 'flex';
                document.getElementById('whatsappBtn').style.background = 'linear-gradient(135deg, #25D366 0%, #128C7E 100%)';
                document.getElementById('whatsappBtn').style.border = 'none';
                loading.classList.remove('show');
                document.getElementById('mainSubtitle').textContent = 'App not installed? Use WhatsApp instead:';
            }, 2500);
        }

        function openWhatsAppFallback() {
            const lat = userLocation?.lat || stand.lat;
            const lng = userLocation?.lng || stand.lng;
            const message = encodeURIComponent(`Hi! I'd like to request a G-Taxi ride from ${stand.name}. Location: https://maps.google.com/?q=${lat},${lng}`);
            window.location.href = `https://wa.me/18687031000?text=${message}`;
        }

        function openAppStore() { window.location.href = 'https://apps.apple.com/app/g-taxi'; }
        function openPlayStore() { window.location.href = 'https://play.google.com/store/apps/details?id=com.gtaxi.rider'; }
    </script>
</body>
</html>
