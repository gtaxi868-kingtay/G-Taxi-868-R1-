<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#07070F">
    <title>G-Taxi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --base: #07070F;
            --ice: #EAF3F6;
            --cyan: #34E6EC;
            --violet: #6D28D9;
            --platinum: #CBD6DE;
            --ink-on-cyan: #06131A;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--base);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--ice);
            padding: 28px 22px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ── Ambient field: violet above, cyan below, faint circuit etch ───── */
        .field { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .field::before {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(520px 400px at 20% 6%, rgba(109,40,217,0.17), transparent 64%),
                radial-gradient(640px 480px at 82% 96%, rgba(52,230,236,0.07), transparent 64%);
        }
        .field::after {
            content: '';
            position: absolute; inset: 0;
            opacity: 0.045;
            background-image:
                linear-gradient(rgba(52,230,236,0.5) 0.5px, transparent 0.5px),
                linear-gradient(90deg, rgba(52,230,236,0.5) 0.5px, transparent 0.5px);
            background-size: 46px 46px;
            mask-image: radial-gradient(68% 52% at 50% 38%, black, transparent);
            -webkit-mask-image: radial-gradient(68% 52% at 50% 38%, black, transparent);
        }

        .stage {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── Staggered entrance (@starting-style, interruptible) ──────────── */
        .rise {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition:
                opacity 480ms var(--ease-out),
                transform 480ms var(--ease-out);
        }
        @starting-style {
            .rise { opacity: 0; transform: translateY(10px) scale(0.985); }
        }
        .rise-2 { transition-delay: 60ms; }
        .rise-3 { transition-delay: 120ms; }
        .rise-4 { transition-delay: 180ms; }
        .rise-5 { transition-delay: 240ms; }

        /* ── The puck: glass disc answering the physical tap ──────────────── */
        .puck-wrap { position: relative; width: 136px; height: 136px; margin-bottom: 22px; }
        .puck {
            position: absolute; inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,0.12), rgba(255,255,255,0.02) 58%),
                radial-gradient(100% 100% at 70% 85%, rgba(52,230,236,0.06), transparent 60%),
                rgba(255,255,255,0.025);
            border: 0.5px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(18px) saturate(1.25);
            -webkit-backdrop-filter: blur(18px) saturate(1.25);
            box-shadow:
                0 28px 64px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.18),
                inset 0 -14px 30px rgba(109,40,217,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .puck img {
            width: 150px; height: 150px; object-fit: contain; display: block;
            filter:
                drop-shadow(0 8px 26px rgba(52,230,236,0.26))
                drop-shadow(0 3px 14px rgba(109,40,217,0.30));
        }
        /* one tap-echo ring — the page answering your tap */
        .puck-wrap::after {
            content: '';
            position: absolute; inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(52,230,236,0.55);
            opacity: 0;
            animation: tap-echo 1300ms var(--ease-out) 500ms 1;
            pointer-events: none;
        }
        @keyframes tap-echo {
            0%   { opacity: 0.7; transform: scale(0.94); }
            100% { opacity: 0;   transform: scale(1.42); }
        }

        /* ── Eyebrow: what you tapped, in tracked micro-caps ──────────────── */
        .eyebrow {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }
        .eyebrow .kind { color: var(--cyan); }
        .eyebrow .kind.kind-merchant { color: #2DD4BF; }
        .eyebrow .kind.kind-driver { color: #E6B450; }
        .eyebrow .code {
            color: var(--platinum);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.18em;
        }
        .eyebrow .sep { color: rgba(234,243,246,0.22); }

        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 600;
            font-size: 40px;
            line-height: 1.06;
            letter-spacing: 0.005em;
            text-align: center;
            margin-top: 12px;
            text-wrap: balance;
        }
        .subtitle {
            color: rgba(234,243,246,0.5);
            font-size: 14px;
            font-weight: 400;
            margin-top: 10px;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.55;
            letter-spacing: 0.005em;
            max-width: 30ch;
        }

        /* ── Actions ───────────────────────────────────────────────────────── */
        .actions { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .btn {
            width: 100%;
            padding: 17px 24px;
            border-radius: 16px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            font-weight: 600;
            letter-spacing: 0.015em;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 140ms var(--ease-out), border-color 140ms var(--ease-out);
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: var(--cyan);
            color: var(--ink-on-cyan);
            box-shadow: 0 12px 36px rgba(52,230,236,0.26), inset 0 1px 0 rgba(255,255,255,0.5);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.04);
            color: rgba(234,243,246,0.78);
            border: 0.5px solid rgba(255,255,255,0.11);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .btn-secondary:active { border-color: rgba(52,230,236,0.45); }
        @media (hover: hover) and (pointer: fine) {
            .btn-secondary:hover { border-color: rgba(52,230,236,0.35); }
        }

        /* ── Signature lit edge: the one violet→cyan use ──────────────────── */
        .lit-edge {
            width: 132px;
            height: 1px;
            margin: 28px 0 0;
            background: linear-gradient(90deg, transparent, var(--violet) 24%, var(--cyan) 76%, transparent);
            position: relative;
            overflow: hidden;
        }
        .lit-edge::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(234,243,246,0.9), transparent);
            transform: translateX(-110%);
            animation: sweep 850ms var(--ease-out) 420ms forwards;
        }
        @keyframes sweep { to { transform: translateX(110%); } }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(234,243,246,0.26);
            line-height: 2.3;
        }
        .footer a {
            color: rgba(52,230,236,0.72);
            text-decoration: none;
            border-bottom: 0.5px solid rgba(52,230,236,0.22);
            padding-bottom: 1px;
        }

        .loading { display: none; margin-top: 22px; text-align: center; }
        .loading.show { display: block; }
        .loading p {
            font-size: 10.5px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(234,243,246,0.5);
        }
        .spinner {
            width: 28px; height: 28px;
            border: 1.5px solid rgba(52,230,236,0.15);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 700ms linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }

        /* ── Reduced motion: keep fades, remove movement ──────────────────── */
        @media (prefers-reduced-motion: reduce) {
            .rise { transition: opacity 300ms ease; }
            @starting-style { .rise { transform: none; } }
            .puck-wrap::after, .lit-edge::after { animation: none; }
            .btn, .btn:active { transition: none; transform: none; }
        }
    </style>
</head>
<body>
    <div class="field"></div>

    <div class="stage">
        <div class="puck-wrap rise">
            <div class="puck"><img src="logo.png" alt="G-Taxi"></div>
        </div>

        <div class="eyebrow rise rise-2">
            <span class="kind" id="cardBadge">Ride</span>
            <span class="sep" id="codeSep" hidden>·</span>
            <span class="code" id="cardCode" hidden></span>
        </div>

        <h1 class="rise rise-2" id="mainTitle">Request your ride</h1>
        <p class="subtitle rise rise-3" id="mainSubtitle">Fast, safe rides across Trinidad &amp; Tobago.</p>

        <div class="actions rise rise-4">
            <button class="btn btn-primary" id="ctaBtn" onclick="handlePrimaryCta()">
                Open G-Taxi
            </button>
            <a class="btn btn-secondary" id="fallbackBtn" href="#" onclick="handleFallback()">
                Request via WhatsApp
            </a>
        </div>

        <div class="loading" id="loadingState">
            <div class="spinner"></div>
            <p id="loadingMsg">Opening G-Taxi</p>
        </div>

        <div class="lit-edge rise rise-5" aria-hidden="true"></div>

        <p class="footer rise rise-5" id="footer">
            Don't have the app?<br>
            <a href="#" onclick="openAppStore()">App Store</a> &nbsp;·&nbsp;
            <a href="#" onclick="openPlayStore()">Google Play</a>
        </p>
    </div>

    <script>
        const SUPABASE_URL = "https://ffbbuafgeypvkpcuvdnv.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmYmJ1YWZnZXlwdmtwY3V2ZG52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc5ODAsImV4cCI6MjA4NjUxMzk4MH0.0bvE6YskOdVROtbto3RrJA9Vj--9M2hKg76oZkOxia8";
        let qrType = 'ride';
        let qrData = null;
        let userLocation = null;
        // Business WhatsApp number — admin-editable in system_config. Falls back
        // to this default if the lookup fails so the page never breaks.
        let supportNumber = '18687031000';
        let resolvedPickup = null; // {name, address, lat, lng} once the tapped touchpoint is resolved

        // Turn the tapped tag/node into a real pickup ("Puck 2 — San Grande" + coords)
        // so a rider with no app can request from exactly where they're standing.
        async function resolveTouchpoint() {
            if (!qrData) return;
            const key = /^[0-9a-f]{8}-/i.test(qrData) ? 'node' : 'tag';
            try {
                const res = await fetch(`${SUPABASE_URL}/functions/v1/resolve_touchpoint?${key}=${encodeURIComponent(qrData)}`);
                if (!res.ok) return;
                const d = await res.json();
                if (d.found && d.pickup) {
                    resolvedPickup = d.pickup;
                    const sub = document.getElementById('mainSubtitle');
                    if (sub) sub.textContent = `Pickup: ${d.pickup.name}. Choose where you’re going.`;
                    const code = document.getElementById('cardCode');
                    if (code) { code.textContent = d.pickup.name; code.hidden = false; document.getElementById('codeSep').hidden = false; }
                }
            } catch (_) { /* keep default copy */ }
        }

        async function loadContactNumber() {
            try {
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/system_config?key=eq.support_whatsapp_number&select=value`,
                    { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
                );
                if (!res.ok) return;
                const rows = await res.json();
                const digits = (rows && rows[0] && rows[0].value || '').replace(/[^\d]/g, '');
                if (digits.length >= 7) supportNumber = digits;
            } catch (_) { /* keep fallback */ }
        }

        function detectQrType() {
            const params = new URLSearchParams(window.location.search);

            if (params.has('tag') || params.has('node')) {
                qrType = 'nfc';
                qrData = params.get('tag') || params.get('node');
            } else if (params.has('merchant') || params.has('store')) {
                qrType = 'merchant';
                qrData = params.get('merchant') || params.get('store');
            } else if (params.has('driver') || params.has('ref')) {
                qrType = 'driver';
                qrData = params.get('driver') || params.get('ref');
            } else if (params.has('ride') || params.has('r')) {
                qrType = 'ride';
                qrData = params.get('ride') || params.get('r');
            } else {
                qrType = 'ride';
                qrData = params.get('stand') || 'san-grande';
            }
        }

        function applyQrTheme() {
            const cardBadge = document.getElementById('cardBadge');
            const cardCode = document.getElementById('cardCode');
            const codeSep = document.getElementById('codeSep');
            const mainTitle = document.getElementById('mainTitle');
            const mainSubtitle = document.getElementById('mainSubtitle');
            const fallbackBtn = document.getElementById('fallbackBtn');
            const loadingMsg = document.getElementById('loadingMsg');

            if (qrType === 'nfc') {
                cardBadge.textContent = 'Touchpoint';
                cardBadge.className = 'kind';
                if (qrData) { cardCode.textContent = qrData; cardCode.hidden = false; codeSep.hidden = false; }
                mainTitle.textContent = 'You tapped in';
                mainSubtitle.textContent = 'This touchpoint becomes your pickup. Open G-Taxi to choose where you’re going.';
                fallbackBtn.textContent = 'Request via WhatsApp';
                loadingMsg.textContent = 'Opening G-Taxi';
            } else if (qrType === 'merchant') {
                cardBadge.textContent = 'Merchant';
                cardBadge.className = 'kind kind-merchant';
                mainTitle.textContent = 'Shop with G-Taxi';
                mainSubtitle.textContent = 'Open G-Taxi to browse or order from this store.';
                fallbackBtn.textContent = 'Contact store via WhatsApp';
                loadingMsg.textContent = 'Opening G-Taxi';
            } else if (qrType === 'driver') {
                cardBadge.textContent = 'Driver';
                cardBadge.className = 'kind kind-driver';
                mainTitle.textContent = 'Drive with G-Taxi';
                mainSubtitle.textContent = 'Join the driver network and earn on every ride.';
                fallbackBtn.textContent = 'Learn more via WhatsApp';
                loadingMsg.textContent = 'Opening driver portal';
            } else {
                cardBadge.textContent = 'Ride';
                cardBadge.className = 'kind';
                mainTitle.textContent = 'Request your ride';
                mainSubtitle.textContent = 'Fast, safe rides across Trinidad & Tobago.';
                fallbackBtn.textContent = 'Request via WhatsApp';
                loadingMsg.textContent = 'Opening G-Taxi';
            }
        }

        function handlePrimaryCta() {
            const loading = document.getElementById('loadingState');
            const btn = document.getElementById('ctaBtn');
            loading.classList.add('show');
            btn.classList.add('hidden');

            let deepLink = 'gtaxi://';

            if (qrType === 'nfc') {
                deepLink += `nfc/${encodeURIComponent(qrData || '')}`;
            } else if (qrType === 'merchant') {
                deepLink += `merchant/${qrData || ''}?source=qr`;
            } else if (qrType === 'driver') {
                deepLink += `driver/signup?ref=${qrData || ''}&source=qr`;
            } else {
                const lat = userLocation?.lat || 10.65;
                const lng = userLocation?.lng || -61.4;
                deepLink += `request?lat=${lat}&lng=${lng}&source=qr`;
                if (qrData && qrData !== 'san-grande') {
                    deepLink += `&stand=${qrData}`;
                }
            }

            window.location.href = deepLink;

            setTimeout(() => {
                loading.classList.remove('show');
                btn.classList.remove('hidden');
                document.getElementById('mainSubtitle').textContent = 'App not found? Use WhatsApp instead:';
            }, 2500);
        }

        function handleFallback() {
            if (qrType === 'nfc') {
                const place = resolvedPickup?.name ? `“${resolvedPickup.name}”` : `touchpoint ${qrData || 'unknown'}`;
                const coords = (resolvedPickup?.lat && resolvedPickup?.lng)
                    ? `\nPickup pin: https://maps.google.com/?q=${resolvedPickup.lat},${resolvedPickup.lng}`
                    : (userLocation ? `\nMy location: https://maps.google.com/?q=${userLocation.lat},${userLocation.lng}` : '');
                const msg = encodeURIComponent(`Hi G-Taxi! I tapped in at ${place} and would like to request a ride.${coords}`);
                window.location.href = `https://wa.me/${supportNumber}?text=${msg}`;
            } else if (qrType === 'merchant') {
                const msg = encodeURIComponent("Hi! I scanned a QR at your store and would like to learn more about G-Taxi services.");
                window.location.href = `https://wa.me/${supportNumber}?text=${msg}`;
            } else if (qrType === 'driver') {
                const msg = encodeURIComponent("Hi! I'm interested in becoming a G-Taxi driver partner. Can you share more details?");
                window.location.href = `https://wa.me/${supportNumber}?text=${msg}`;
            } else {
                const lat = userLocation?.lat || 10.65;
                const lng = userLocation?.lng || -61.4;
                const msg = encodeURIComponent(`Hi! I'd like to request a G-Taxi ride. My location: https://maps.google.com/?q=${lat},${lng}`);
                window.location.href = `https://wa.me/${supportNumber}?text=${msg}`;
            }
        }

        function openAppStore() { window.location.href = 'https://apps.apple.com/app/g-taxi'; }
        function openPlayStore() { window.location.href = 'https://play.google.com/store/apps/details?id=com.gtaxi.rider'; }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => { userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude }; },
                () => {}
            );
        }

        detectQrType();
        applyQrTheme();
        loadContactNumber();
        if (qrType === 'nfc' || qrType === 'ride') resolveTouchpoint();
    </script>
</body>
</html>
