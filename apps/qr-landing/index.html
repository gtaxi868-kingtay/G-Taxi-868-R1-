<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>G-Taxi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0B0E12;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #F2F5F8;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 20px;
        }
        .logo-ride { background: linear-gradient(135deg, #8B5CF6, #1DE0E6); }
        .logo-merchant { background: linear-gradient(135deg, #14B8A6, #0D9488); }
        .logo-driver { background: linear-gradient(135deg, #F59E0B, #D97706); }
        .logo-default { background: linear-gradient(135deg, #8B5CF6, #1DE0E6); }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: -0.3px;
        }
        .subtitle {
            color: rgba(242,245,248,0.55);
            font-size: 14px;
            margin-bottom: 28px;
            text-align: center;
            line-height: 1.4;
        }
        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px;
            max-width: 340px;
            width: 100%;
            margin-bottom: 20px;
        }
        .card-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
        }
        .card-icon-ride { background: rgba(139,92,246,0.15); }
        .card-icon-merchant { background: rgba(20,184,166,0.15); }
        .card-icon-driver { background: rgba(245,158,11,0.15); }
        .card-icon-default { background: rgba(139,92,246,0.15); }
        .card-label { font-size: 11px; font-weight: 600; color: rgba(242,245,248,0.35); letter-spacing: 0.5px; text-transform: uppercase; }
        .card-value { font-size: 15px; font-weight: 600; color: #F2F5F8; margin-top: 2px; }
        .card-desc { font-size: 12px; color: rgba(242,245,248,0.45); margin-top: 2px; line-height: 1.3; }
        .btn {
            width: 100%;
            max-width: 340px;
            padding: 16px 24px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: #8B5CF6;
            color: white;
            margin-bottom: 10px;
        }
        .btn-primary:active { background: #7C3AED; }
        .btn-teal {
            background: #14B8A6;
            color: white;
            margin-bottom: 10px;
        }
        .btn-teal:active { background: #0D9488; }
        .btn-amber {
            background: #F59E0B;
            color: white;
            margin-bottom: 10px;
        }
        .btn-amber:active { background: #D97706; }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: rgba(242,245,248,0.7);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:active { background: rgba(255,255,255,0.1); }
        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 11px;
            color: rgba(242,245,248,0.25);
            line-height: 1.5;
        }
        .footer a { color: #1DE0E6; text-decoration: none; }
        .loading {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        .loading.show { display: block; }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(139,92,246,0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .badge-ride { background: rgba(139,92,246,0.15); color: #8B5CF6; }
        .badge-merchant { background: rgba(20,184,166,0.15); color: #14B8A6; }
        .badge-driver { background: rgba(245,158,11,0.15); color: #F59E0B; }
        .badge-default { background: rgba(139,92,246,0.15); color: #8B5CF6; }
    </style>
</head>
<body>
    <div class="logo logo-default" id="logo">G</div>
    <h1 id="mainTitle">Welcome to G-Taxi</h1>
    <p class="subtitle" id="mainSubtitle">Trinidad & Tobago's ride ecosystem</p>

    <div class="card" id="infoCard">
        <div class="card-row">
            <div class="card-icon card-icon-default" id="cardIcon">🚗</div>
            <div>
                <div class="card-label" id="cardBadge">RIDE</div>
                <div class="card-value" id="cardValue">Quick ride request</div>
                <div class="card-desc" id="cardDesc">Open G-Taxi to get picked up</div>
            </div>
        </div>
    </div>

    <button class="btn btn-primary" id="ctaBtn" onclick="handlePrimaryCta()">
        Open G-Taxi App
    </button>

    <a class="btn btn-secondary" id="fallbackBtn" href="#" onclick="handleFallback()">
        Request via WhatsApp
    </a>

    <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <p id="loadingMsg">Opening G-Taxi...</p>
    </div>

    <p class="footer" id="footer">
        Don't have the app?<br>
        <a href="#" onclick="openAppStore()">Download on App Store</a> or
        <a href="#" onclick="openPlayStore()">Google Play</a>
    </p>

    <script>
        const SUPABASE_URL = "https://ffbbuafgeypvkpcuvdnv.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmYmJ1YWZnZXlwdmtwY3V2ZG52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc5ODAsImV4cCI6MjA4NjUxMzk4MH0.0bvE6YskOdVROtbto3RrJA9Vj--9M2hKg76oZkOxia8";
        let qrType = 'ride';
        let qrData = null;
        let userLocation = null;

        function detectQrType() {
            const params = new URLSearchParams(window.location.search);

            if (params.has('merchant') || params.has('store')) {
                qrType = 'merchant';
                qrData = params.get('merchant') || params.get('store');
            } else if (params.has('driver') || params.has('ref')) {
                qrType = 'driver';
                qrData = params.get('driver') || params.get('ref');
            } else if (params.has('ride') || params.has('r')) {
                qrType = 'ride';
                qrData = params.get('ride') || params.get('r');
            } else {
                qrType = 'ride';
                qrData = params.get('stand') || 'san-grande';
            }
        }

        function applyQrTheme() {
            const logo = document.getElementById('logo');
            const ctaBtn = document.getElementById('ctaBtn');
            const cardIcon = document.getElementById('cardIcon');
            const cardBadge = document.getElementById('cardBadge');
            const cardValue = document.getElementById('cardValue');
            const cardDesc = document.getElementById('cardDesc');
            const mainTitle = document.getElementById('mainTitle');
            const mainSubtitle = document.getElementById('mainSubtitle');
            const fallbackBtn = document.getElementById('fallbackBtn');
            const loadingMsg = document.getElementById('loadingMsg');

            if (qrType === 'merchant') {
                logo.className = 'logo logo-merchant';
                ctaBtn.className = 'btn btn-teal';
                cardIcon.className = 'card-icon card-icon-merchant';
                cardBadge.className = 'badge badge-merchant';
                mainTitle.textContent = 'Welcome to G-Taxi';
                mainSubtitle.textContent = 'Visit this store via G-Taxi';
                cardValue.textContent = 'Store QR';
                cardDesc.textContent = 'Open G-Taxi to browse or order from this merchant.';
                cardBadge.textContent = 'MERCHANT';
                fallbackBtn.textContent = 'Contact store via WhatsApp';
                loadingMsg.textContent = 'Opening G-Taxi...';
            } else if (qrType === 'driver') {
                logo.className = 'logo logo-driver';
                ctaBtn.className = 'btn btn-amber';
                cardIcon.className = 'card-icon card-icon-driver';
                cardBadge.className = 'badge badge-driver';
                mainTitle.textContent = 'Driver Referral';
                mainSubtitle.textContent = 'Join the G-Taxi driver network';
                cardValue.textContent = 'Driver signup';
                cardDesc.textContent = 'Become a G-Taxi driver partner. Earn on every ride.';
                cardBadge.textContent = 'DRIVER';
                fallbackBtn.textContent = 'Learn more via WhatsApp';
                loadingMsg.textContent = 'Opening driver portal...';
            } else {
                logo.className = 'logo logo-ride';
                ctaBtn.className = 'btn btn-primary';
                cardIcon.className = 'card-icon card-icon-ride';
                cardBadge.className = 'badge badge-ride';
                mainTitle.textContent = 'Request Your Ride';
                mainSubtitle.textContent = 'Fast, safe rides in Trinidad & Tobago';
                cardValue.textContent = 'Quick ride request';
                cardDesc.textContent = 'Open G-Taxi to get picked up at your location.';
                cardBadge.textContent = 'RIDE';
                fallbackBtn.textContent = 'Request via WhatsApp';
                loadingMsg.textContent = 'Opening G-Taxi...';
            }
        }

        function handlePrimaryCta() {
            const loading = document.getElementById('loadingState');
            const btn = document.getElementById('ctaBtn');
            loading.classList.add('show');
            btn.classList.add('hidden');

            let deepLink = 'gtaxi://';

            if (qrType === 'merchant') {
                deepLink += `merchant/${qrData || ''}?source=qr`;
            } else if (qrType === 'driver') {
                deepLink += `driver/signup?ref=${qrData || ''}&source=qr`;
            } else {
                const lat = userLocation?.lat || 10.65;
                const lng = userLocation?.lng || -61.4;
                deepLink += `request?lat=${lat}&lng=${lng}&source=qr`;
                if (qrData && qrData !== 'san-grande') {
                    deepLink += `&stand=${qrData}`;
                }
            }

            window.location.href = deepLink;

            setTimeout(() => {
                const fallback = document.getElementById('fallbackBtn');
                if (qrType === 'merchant') {
                    fallback.style.background = '#134E4A';
                    fallback.style.border = 'none';
                } else if (qrType === 'driver') {
                    fallback.style.background = '#78350F';
                    fallback.style.border = 'none';
                } else {
                    fallback.style.background = '#4C1D95';
                    fallback.style.border = 'none';
                }
                loading.classList.remove('show');
                mainSubtitle.textContent = 'App not found? Use WhatsApp instead:';
            }, 2500);
        }

        function handleFallback() {
            if (qrType === 'merchant') {
                const msg = encodeURIComponent("Hi! I scanned a QR at your store and would like to learn more about G-Taxi services.");
                window.location.href = `https://wa.me/18687031000?text=${msg}`;
            } else if (qrType === 'driver') {
                const msg = encodeURIComponent("Hi! I'm interested in becoming a G-Taxi driver partner. Can you share more details?");
                window.location.href = `https://wa.me/18687031000?text=${msg}`;
            } else {
                const lat = userLocation?.lat || 10.65;
                const lng = userLocation?.lng || -61.4;
                const msg = encodeURIComponent(`Hi! I'd like to request a G-Taxi ride. My location: https://maps.google.com/?q=${lat},${lng}`);
                window.location.href = `https://wa.me/18687031000?text=${msg}`;
            }
        }

        function openAppStore() { window.location.href = 'https://apps.apple.com/app/g-taxi'; }
        function openPlayStore() { window.location.href = 'https://play.google.com/store/apps/details?id=com.gtaxi.rider'; }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => { userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude }; },
                () => {}
            );
        }

        detectQrType();
        applyQrTheme();
    </script>
</body>
</html>
