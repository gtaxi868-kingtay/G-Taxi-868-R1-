services:
  caddy:
    image: caddy:2-alpine
    container_name: g-taxi-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    networks:
      - appnet
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
      BLUE_UPSTREAM: ${BLUE_UPSTREAM:-worker-blue:8080}
      GREEN_UPSTREAM: ${GREEN_UPSTREAM:-worker-green:8080}

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: g-taxi-uptime-kuma
    restart: unless-stopped
    volumes:
      - ./uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    container_name: g-taxi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    networks:
      - appnet

  worker:
    build:
      context: ./worker
    container_name: g-taxi-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_TICK_SECONDS: ${WORKER_TICK_SECONDS:-60}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DOMAIN: ${DOMAIN:-localhost}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      - redis
    networks:
      - appnet

  # Keep the two release slots separate so an HTTP worker can be promoted by
  # changing BLUE_UPSTREAM/GREEN_UPSTREAM without rebuilding the proxy.
  worker-blue:
    profiles: [release-slots]
    build:
      context: ./worker
    container_name: g-taxi-worker-blue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_TICK_SECONDS: ${WORKER_TICK_SECONDS:-60}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      HTTP_PORT: 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      - redis
    networks:
      - appnet

  worker-green:
    profiles: [release-slots]
    build:
      context: ./worker
    container_name: g-taxi-worker-green
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_TICK_SECONDS: ${WORKER_TICK_SECONDS:-60}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      HTTP_PORT: 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      - redis
    networks:
      - appnet

  # Jarvis (rider AI concierge, ../../services/jarvis) had a real Dockerfile
  # but was never wired into this stack -- docker-compose up here would
  # start Caddy/Kuma/Redis/worker and nothing would ever be listening on
  # :8000, so ai_concierge_proactive's calls to JARVIS_SERVICE_URL would
  # always fail over to its deterministic fallback, forever, even with a
  # VPS fully provisioned. Added so it starts with everything else.
  jarvis:
    build:
      context: ../../services/jarvis
    container_name: g-taxi-jarvis
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      JARVIS_SECRET: ${JARVIS_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: "8000"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
